# 本文件只放「环境相关的两项」：Nacos 地址 + import。
# 其余（命名空间、file-extension 等）都在 application.yml 里，上线不用改。
# ⚠️ import 必须与地址同文件：若把 import 写在 application.yml，会读不到这里的地址，
#    静默退回默认的 127.0.0.1:8848（本地看不出问题，换环境才暴露）。
spring:
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
  config:
    import:
      - nacos:wisdomhub-env.yaml
      - nacos:wisdomhub-common.yaml
      - nacos:notification-service.yaml
