[project]
name = "wisdomhub-agent"
version = "0.1.0"
description = "WisdomHub AI 引擎：会话聊天与文章分析"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aio-pika>=10.2.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.1",
    "httpx>=0.28",
    "langchain>=1.4.5",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "nacos-sdk-python>=3.2.0",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2",
    "tiktoken>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "python-dotenv>=1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
src = ["app", "tests"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["pg: 需要本地 PostgreSQL"]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
