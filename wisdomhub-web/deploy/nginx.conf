# WisdomHub 前端 Nginx 配置
# 复制到 /etc/nginx/conf.d/wisdomhub.conf，按实际路径 / 网关地址调整。
# 若 Nginx 跑在 Docker 里，upstream 改为 host.docker.internal:9090 并加 --add-host。

upstream wisdomhub_gateway {
    server 127.0.0.1:9090;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    client_max_body_size 10m;

    # 通知 STOMP：原生 WebSocket + Upgrade（必须先于 /api/ 匹配）
    location = /api/notification/ws {
        proxy_pass http://wisdomhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # AI SSE：关闭缓冲，保持长连接
    location ^~ /api/agent/ {
        proxy_pass http://wisdomhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 业务接口统一走网关
    location /api/ {
        proxy_pass http://wisdomhub_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 落地页：landing/ 目录整体拷到 <root>/landing/
    location = / {
        root /usr/share/nginx/html/landing;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /styles.css {
        root /usr/share/nginx/html/landing;
        add_header Cache-Control "no-cache";
    }

    location = /main.js {
        root /usr/share/nginx/html/landing;
        add_header Cache-Control "no-cache";
    }

    # 带 hash 的静态资源长缓存
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA 入口 HTML 不缓存，避免发布后命中旧壳
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA history fallback（/home、/articles、/login 等）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
